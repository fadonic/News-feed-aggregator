server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip common text-based assets for faster delivery.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cache hashed static assets aggressively — Vite fingerprints filenames
    # (e.g. index-Dcy0DSTN.js), so a new build always gets new URLs and
    # never serves a stale cached file.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: any route that isn't a real file falls back to
    # index.html, letting client-side routing (if added) handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}